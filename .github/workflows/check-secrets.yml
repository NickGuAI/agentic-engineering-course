name: Check for committed secrets

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets
        run: |
          # Best-effort filter, not a guarantee: this only catches a few
          # common API key shapes and obvious secret file names. It will
          # miss secrets in other formats, so it is not a substitute for
          # not committing them in the first place.
          set +e
          FOUND=0

          PATTERN='sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}'
          MATCHES=$(grep -rIn -E "$PATTERN" --exclude-dir=.git .)
          if [ -n "$MATCHES" ]; then
            while IFS= read -r line; do
              file_line=$(printf '%s' "$line" | cut -d: -f1-2)
              echo "::error::Possible secret committed: $file_line"
            done <<< "$MATCHES"
            FOUND=1
          fi

          NAME_MATCHES=$(find . -path ./.git -prune -o \( -name 'auth.json' -o -name '.env' -o -name '*.env' \) -print)
          if [ -n "$NAME_MATCHES" ]; then
            while IFS= read -r f; do
              echo "::error::Possible secret committed: $f"
            done <<< "$NAME_MATCHES"
            FOUND=1
          fi

          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "No secret patterns found."
