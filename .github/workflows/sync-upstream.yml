name: Sync course materials

# The push trigger also registers this workflow in a freshly created repo
# (GitHub only enables schedule/workflow_dispatch-only workflows once they've
# been seen on the default branch); pushes made by the workflow's own token
# do not retrigger it.
on:
  push:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'NickGuAI/agentic-engineering-course' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest course materials from upstream
        run: |
          git config user.name "course-sync"
          git config user.email "course-sync@users.noreply.github.com"
          git remote add upstream https://github.com/NickGuAI/agentic-engineering-course.git
          git fetch upstream main
          if git merge --no-edit upstream/main; then
            git push origin HEAD
          else
            echo "::error::Merge conflict with course materials. Run 'git pull upstream main' locally, resolve, commit, push."
            exit 1
          fi
