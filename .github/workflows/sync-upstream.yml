name: Sync course materials

# The push trigger also registers this workflow in a freshly created repo
# (GitHub only enables schedule/workflow_dispatch-only workflows once they've
# been seen on the default branch); pushes made by the workflow's own token
# do not retrigger it.
on:
  push:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'NickGuAI/agentic-engineering-course' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest course materials from upstream
        run: |
          git config user.name "course-sync"
          git config user.email "course-sync@users.noreply.github.com"
          git remote add upstream https://github.com/NickGuAI/agentic-engineering-course.git
          git fetch upstream main
          UP="upstream/main"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "Already up to date."
            exit 0
          fi
          BASE="$(git merge-base HEAD "$UP")"
          # The Actions token is not allowed to write .github/workflows. When the course
          # changed a workflow file, stop here and ask the student to pull once by hand.
          if ! git diff --quiet "$BASE" "$UP" -- .github/workflows; then
            echo "::error::Course workflow files changed upstream and this job cannot update them. Run 'git pull upstream main' locally, then push. Syncs resume automatically afterwards."
            exit 1
          fi
          if ! git merge --no-edit "$UP"; then
            echo "::error::Merge conflict with course materials. Run 'git pull upstream main' locally, resolve, commit, push."
            exit 1
          fi
          git push origin HEAD
